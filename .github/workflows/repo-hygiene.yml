name: repo-hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Ensure no secrets-like example values are committed
        run: |
          if grep -RInE '(sk-[A-Za-z0-9]{16,}|AIza[0-9A-Za-z_-]{20,}|ghp_[A-Za-z0-9]{20,})' . \
            --exclude-dir=.git \
            --exclude=SHA256SUMS; then
            echo 'Potential real secret detected in repository contents.'
            exit 1
          fi
      - name: Ensure generated runtime files are not committed
        run: |
          test ! -f Dockerfile
          test ! -f docker-compose.yml
          test ! -f bootstrap.sh
          test ! -f healthcheck.sh
          test ! -f bin/hades
          test ! -f bin/hades.ps1
          test ! -f bin/hades.cmd
      - name: Check for trailing whitespace in Markdown files
        run: |
          if grep -rn '[[:space:]]$' --include='*.md' .; then
            echo 'Trailing whitespace found in .md files (see lines above).'
            exit 1
          fi
      - name: Validate markdown formatting
        run: |
          if grep -rn ' $' --include='*.md' .; then
            echo 'Trailing whitespace found in markdown files. Remove it.'
            exit 1
          fi
          echo "markdown-formatting-ok"
